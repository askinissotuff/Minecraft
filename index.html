<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#202b36"><title>Voxel Realms — Build, Explore, Survive</title>
<style>
:root{--panel:#c6c6c6;--edge:#373737;--shadow:#202020;--green:#526f35;--blue:#3b6c91}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#83bce8;font-family:Arial,Helvetica,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;touch-action:none;image-rendering:pixelated}button{font:inherit;color:#fff;cursor:pointer;touch-action:manipulation}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none;color:#fff;text-shadow:2px 2px 0 #222, -1px -1px 0 #222}
#topline{position:absolute;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900;letter-spacing:1px}
#gametitle{display:none}#health{font-size:clamp(14px,3vw,21px);letter-spacing:1px}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:24px Arial;color:#fff;text-shadow:1px 1px #333,-1px -1px #333}
#hotbar{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:0;padding:4px;background:#1717179c;border:2px solid #dedede;box-shadow:0 2px 0 #222, inset 0 0 0 2px #555;pointer-events:auto;max-width:98vw;overflow-x:auto}
.slot{flex:0 0 clamp(35px,8.5vw,52px);height:clamp(40px,9.5vw,56px);border:2px solid #777;background:#7779;display:grid;place-items:center;position:relative;font-size:0;border-radius:0;padding:2px;box-shadow:inset 2px 2px #ffffff25,inset -2px -2px #0003}
.item-icon{display:block;width:27px;height:27px;border:2px solid #ffffff99;box-shadow:inset 2px 2px #ffffff55,inset -2px -2px #0005;image-rendering:pixelated}
.item-grass{background:linear-gradient(#65a83c 0 28%,#87552f 28%)}.item-dirt{background:#87552f repeating-linear-gradient(135deg,transparent 0 4px,#6e4529 4px 6px)}.item-stone{background:#858585 repeating-linear-gradient(45deg,transparent 0 5px,#aaa 5px 7px)}.item-sand{background:#d8c47c repeating-linear-gradient(90deg,transparent 0 5px,#c6ae65 5px 7px)}.item-wood{background:repeating-linear-gradient(90deg,#9b6b39 0 5px,#684522 5px 7px)}.item-planks{background:repeating-linear-gradient(0deg,#b88a4f 0 6px,#79552f 6px 8px)}.item-leaves{background:#397a35 radial-gradient(#77ad48 2px,transparent 3px)}.item-coal{background:radial-gradient(#292929 0 38%,transparent 40%),#858585}.item-water{background:linear-gradient(135deg,#8bd5f5,#2879c8)}
.slot.selected{outline:3px solid #fff;outline-offset:-3px;background:#ffffff55;transform:translateY(-4px) scale(1.05);z-index:1}.slot small{position:absolute;bottom:0;right:3px;font-size:11px;font-weight:900}.slot .qty{position:absolute;top:0;left:3px;font-size:9px;color:#eee}
#mobile{display:none;position:fixed;inset:0;z-index:4;pointer-events:none}
#stick{position:absolute;left:20px;bottom:calc(104px + env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;background:radial-gradient(circle,#7778,#24242488);border:3px solid #eee9;box-shadow:0 3px 8px #0008,inset 0 0 0 3px #2225;pointer-events:auto;touch-action:none}
#nub{position:absolute;width:50px;height:50px;left:30px;top:30px;border-radius:50%;background:linear-gradient(145deg,#e5e5e5bd,#777b);border:2px solid #fff;box-shadow:0 2px 5px #0009}
#touchbuttons{position:absolute;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));width:164px;height:190px;pointer-events:auto}
#touchbuttons button{position:absolute;display:grid;place-items:center;padding:0;background:linear-gradient(145deg,#707b82c9,#202a30c9);border:2px solid #e7e7e7c9;box-shadow:0 3px 0 #171717, inset 0 2px 4px #ffffff55;border-radius:50%;font-weight:900;text-shadow:1px 2px #111;color:#fff}
#touchbuttons button:active{filter:brightness(1.35);transform:scale(.94)}
#touchbuttons #jump{right:8px;top:0;width:66px;height:66px;font-size:31px}
#touchbuttons #sneak{left:2px;top:70px;width:50px;height:50px;font-size:21px}
#touchbuttons #mine{right:8px;top:76px;width:62px;height:62px;font-size:25px}
#touchbuttons #place{left:24px;bottom:0;width:54px;height:54px;font-size:23px}
#touchbuttons #inventoryBtn{right:0;bottom:0;width:52px;height:52px;font-size:22px}
 #lookpad{position:absolute;left:38%;right:0;top:12%;bottom:220px;pointer-events:auto;touch-action:none;background:transparent} #lookhint{position:absolute;right:12px;top:calc(36px + env(safe-area-inset-top));font-size:9px;letter-spacing:1px;background:#0006;padding:5px 7px;border:1px solid #ffffff44;border-radius:2px}
#pause{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:5;padding:5px 11px;display:none;pointer-events:auto;background:#2229;border:2px solid #ddd;border-radius:2px;box-shadow:0 2px #111;font-weight:900}
#menu{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:linear-gradient(#172b3a55,#1720189c),url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80') center/cover}
#menu.hidden{display:none}#panel{width:min(460px,92vw);padding:clamp(17px,4vw,28px);text-align:center;background:#c6c6c6;border:4px solid #373737;box-shadow:inset 0 0 0 3px #eee,0 10px 30px #0009;color:#222;text-shadow:none}
#logo{font-size:clamp(38px,10vw,66px);font-weight:1000;letter-spacing:-3px;line-height:1;color:#fff;text-shadow:4px 4px 0 #4c4c4c,-2px -2px 0 #555,2px -2px 0 #555,-2px 2px 0 #555;margin:4px 0}
#subtitle{font-size:11px;font-weight:900;letter-spacing:4px;color:#444;margin:9px 0 22px}
#panel button,#invclose{display:block;width:100%;margin:10px 0;padding:12px 10px;background:#777;border:3px solid #333;border-radius:1px;box-shadow:inset 0 0 0 2px #aaa,0 2px 0 #333;font-size:16px;font-weight:900;letter-spacing:.5px}
#panel button:active,#invclose:active{background:#596d4c;transform:translateY(1px)}#panel p{font-size:11px;color:#444;line-height:1.5;margin:18px 0 0}
#inventory{position:fixed;inset:0;z-index:7;display:none;place-items:center;background:#000a;padding:12px}#inventory.open{display:grid}
#invpanel{width:min(520px,96vw);background:#c6c6c6;color:#222;padding:14px;border:4px solid #454545;box-shadow:inset 0 0 0 3px #eee,0 8px 25px #0009;text-shadow:none}
#invpanel h2{margin:2px 0 14px;font-size:19px;color:#333}#invgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.invslot{aspect-ratio:1;background:#777;border:2px solid #eee;box-shadow:inset 2px 2px #ffffff33,inset -2px -2px #0005;display:grid;place-items:center;gap:3px;padding:4px;color:white;text-shadow:1px 2px #222;border-radius:0;font-size:11px}
.invslot .item-icon{width:30px;height:30px}.invslot small{font-size:10px;font-weight:700}
#craftlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px;max-height:30vh;overflow:auto}.craftrecipe{background:#777;color:#fff;border:2px solid #eee;padding:9px 5px;font-size:11px;font-weight:900;text-shadow:1px 1px #222}.craftrecipe:disabled{opacity:.4}#invclose{margin:14px 0 0;background:#687e4b}
#toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);background:#171717c9;color:#fff;padding:8px 13px;z-index:9;opacity:0;pointer-events:none;border:1px solid #ffffff55;font-size:13px}
#breakmeter{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);width:48px;height:5px;background:#222;display:none}#breakfill{height:100%;width:0;background:#fff}
@media(pointer:coarse),(max-width:800px){#mobile{display:block}#pause{display:block}#topline{right:54px}#gametitle{display:block;font-size:10px}#health{font-size:16px}}
@media(max-width:380px){#stick{width:100px;height:100px;left:12px}#nub{left:24px;top:24px}#touchbuttons{right:6px;transform:scale(.9);transform-origin:bottom right}#hotbar{max-width:100vw}}
@media(pointer:coarse){#pause{display:block}}
#netpanel input,#netpanel button{font:700 14px Arial;border:2px solid #333;border-radius:0}#netpanel button{color:#fff;box-shadow:inset 0 0 0 1px #ffffff55}#netroom{padding:8px;background:#aaa;margin:8px 0}#netroom button{padding:6px;margin-left:6px;background:#526f35}
</style></head><body>
<div id="hud"><div id="topline"><span id="gametitle">VOXEL REALMS</span><span id="health">♥♥♥♥♥♥♥♥♥♥</span></div><div id="crosshair">+</div><div id="breakmeter"><div id="breakfill"></div></div><div id="hotbar"></div></div>
<div id="mobile"><div id="stick"><div id="nub"></div></div><div id="lookpad" aria-label="Touch and drag here to look"></div><div id="lookhint">DRAG TO LOOK</div><div id="touchbuttons"><button id="jump" aria-label="Jump">⬆</button><button id="sneak" aria-label="Sneak">⬇</button><button id="mine" aria-label="Mine">⛏</button><button id="place" aria-label="Place block">▣</button><button id="inventoryBtn" aria-label="Inventory">▦</button></div></div>
<button id="pause" aria-label="Pause">Ⅱ</button>
<div id="menu"><div id="panel"><div id="logo">VOXEL REALMS</div><div id="subtitle">BUILD · EXPLORE · SURVIVE</div><button id="play">▶ &nbsp; PLAY</button><button id="mode">MODE: SURVIVAL</button><button id="reset">＋ &nbsp; CREATE NEW WORLD</button><p>Explore a world made of blocks.<br>Left stick to move · Drag to look · Tap to mine and build.</p></div></div>
<div id="inventory"><div id="invpanel"><h2>Inventory</h2><div id="invgrid"></div><h2 style="margin-top:16px">Crafting</h2><div id="craftlist"></div><button id="invclose">BACK TO GAME</button></div></div><div id="toast"></div>
<script type="module" src="./game.js"></script></body></html>
