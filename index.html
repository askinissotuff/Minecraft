<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#17251b"><title>Blockcraft — Voxel Survival</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7bb7e7;font-family:system-ui,sans-serif;touch-action:none;user-select:none}canvas{display:block;touch-action:none}button{font:inherit;color:white;border:1px solid #ffffff75;background:#202a25c9;border-radius:5px;box-shadow:0 2px 0 #0007;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:1px 2px 3px #000;z-index:3}#topline{position:absolute;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;font-size:12px;font-weight:800}#health{font-size:18px}#crosshair{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:24px}#hotbar{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:#777;border:3px solid #292929;box-shadow:inset 0 0 0 2px #bbb;pointer-events:auto;max-width:98vw;overflow-x:auto}.slot{width:clamp(34px,8vw,48px);height:clamp(38px,9vw,50px);border:2px solid #777;background:#555b;display:grid;place-items:center;position:relative;font-size:0}.item-icon{display:block;width:25px;height:25px;border:2px solid #ffffffa8;box-shadow:inset 2px 2px #ffffff55,inset -2px -2px #0005;image-rendering:pixelated;background-color:#777}.item-grass{background:linear-gradient(#69a83d 0 28%,#87552f 28% 100%)}.item-dirt{background-color:#87552f;background-image:repeating-linear-gradient(135deg,transparent 0 4px,#6e4529 4px 6px)}.item-stone{background-color:#858585;background-image:repeating-linear-gradient(45deg,transparent 0 5px,#aaa 5px 7px)}.item-sand{background-color:#d8c47c;background-image:repeating-linear-gradient(90deg,transparent 0 5px,#c6ae65 5px 7px)}.item-wood{background:repeating-linear-gradient(90deg,#9b6b39 0 5px,#684522 5px 7px)}.item-planks{background:repeating-linear-gradient(0deg,#b88a4f 0 6px,#79552f 6px 8px)}.item-leaves{background-color:#397a35;background-image:radial-gradient(#77ad48 2px,transparent 3px)}.item-coal{background:radial-gradient(#292929 0 38%,transparent 40%),#858585}.item-water{background:linear-gradient(135deg,#8bd5f5,#2879c8)}.slot.selected{border:3px solid white;background:#ffffff55;transform:scale(1.08)}.slot small{position:absolute;bottom:0;right:3px;font-size:10px}.slot .qty{position:absolute;top:0;left:3px;font-size:9px}#mobile{display:none;position:fixed;inset:0;z-index:4;pointer-events:none}#stick{position:absolute;left:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;background:#3339;border:3px solid #ddd9;pointer-events:auto;touch-action:none}#nub{position:absolute;width:48px;height:48px;left:29px;top:29px;border-radius:50%;background:#bbb9;border:3px solid #eee}#touchbuttons{position:absolute;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,58px);grid-template-rows:repeat(3,58px);gap:8px;align-items:center;justify-items:center;pointer-events:auto}#touchbuttons button{width:58px;height:58px;padding:0;display:grid;place-items:center;font-size:25px;font-weight:900;color:#fff;background:linear-gradient(145deg,#59636dcc,#171d25bb);border:2px solid #d5dbe0a8;box-shadow:inset 0 2px 3px #ffffff38,0 3px 5px #0008;border-radius:50%;text-shadow:0 2px 3px #000}#touchbuttons button:active{background:#9aa6b8dd;transform:scale(.94)}#touchbuttons #jump{grid-column:2;grid-row:1;width:66px;height:66px;font-size:30px}#touchbuttons #sneak{grid-column:1;grid-row:2;width:52px;height:52px;font-size:23px}#touchbuttons #mine{grid-column:2;grid-row:2;font-size:24px}#touchbuttons #place{grid-column:1;grid-row:3;font-size:23px}#touchbuttons .wide{grid-column:2;grid-row:3;width:58px;height:58px;font-size:11px;border-radius:14px}#lookhint{position:absolute;right:12px;top:55px;font-size:10px;background:#0006;padding:5px 8px;border-radius:4px}#menu{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:linear-gradient(#14253699,#101a18dd);padding:20px}#menu.hidden{display:none}#panel{width:min(440px,94vw);padding:22px;background:#c6c6c6;color:#242424;border:4px solid #383838;box-shadow:inset 0 0 0 3px #eee,0 12px 40px #0009;text-align:center;text-shadow:none}#logo{font-size:clamp(35px,9vw,58px);font-weight:1000;color:#fff;text-shadow:3px 3px #555,-1px -1px #555;margin-bottom:4px}#subtitle{color:#444;font-size:12px;letter-spacing:3px;margin-bottom:22px}#panel button{display:block;width:100%;margin:9px 0;padding:12px;background:#777;color:#fff;border:3px solid #333;border-radius:2px;box-shadow:inset 0 0 0 2px #aaa;font-weight:800;font-size:17px}#panel p{font-size:12px;color:#444;line-height:1.5}#inventory{position:fixed;inset:0;z-index:7;display:none;place-items:center;background:#0009;padding:15px}#inventory.open{display:grid}#invpanel{width:min(520px,95vw);background:#c6c6c6;color:#222;padding:12px;border:4px solid #555;text-shadow:none}#invgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.invslot{aspect-ratio:1;background:#777;border:2px solid #eee;display:grid;place-items:center;font-size:12px;color:white;text-shadow:1px 2px #222;gap:3px}.invslot .item-icon{width:30px;height:30px}.invslot small{font-size:10px}#invclose{margin-top:10px;width:100%;padding:10px;background:#596d4c}#toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);background:#171717b9;color:white;padding:8px 13px;z-index:6;opacity:0;pointer-events:none}#pause{position:fixed;top:45px;right:10px;z-index:5;padding:7px 10px;display:none;pointer-events:auto}#breakmeter{position:absolute;left:50%;top:calc(48% + 24px);transform:translateX(-50%);width:42px;height:5px;background:#222;display:none}#breakfill{height:100%;width:0;background:white}
@media(pointer:coarse),(max-width:800px){#mobile{display:block}#pause{display:block}#topline{top:calc(5px + env(safe-area-inset-top))}#health{font-size:15px}}@media(pointer:fine) and (min-width:801px){#lookhint{display:none}}
</style></head><body><div id="hud"><div id="topline"><span id="gametitle">BLOCKCRAFT</span><span id="health">♥♥♥♥♥♥♥♥♥♥</span></div><div id="crosshair">+</div><div id="breakmeter"><div id="breakfill"></div></div><div id="hotbar"></div></div><div id="mobile"><div id="stick"><div id="nub"></div></div><div id="lookhint">DRAG RIGHT SIDE TO LOOK</div><div id="touchbuttons"><button id="jump" aria-label="Jump">⬆</button><button id="sneak" aria-label="Sneak">⬇</button><button id="mine" aria-label="Mine">⛏</button><button id="place" aria-label="Place block">▣</button><button id="inventoryBtn" class="wide" aria-label="Inventory">▦</button></div></div><button id="pause">Ⅱ</button><div id="menu"><div id="panel"><div id="logo">BLOCKCRAFT</div><div id="subtitle">SURVIVAL MODE</div><button id="play">▶ PLAY WORLD</button><button id="mode">MODE: SURVIVAL</button><button id="reset">NEW WORLD</button><p>Original voxel sandbox · Touch controls supported<br>Left stick moves · Drag right side to look.</p></div></div><div id="inventory"><div id="invpanel"><h2>Inventory</h2><div id="invgrid"></div><button id="invclose">BACK TO GAME</button></div></div><div id="toast"></div><script type="module" src="./game.js"></script></body></html>
